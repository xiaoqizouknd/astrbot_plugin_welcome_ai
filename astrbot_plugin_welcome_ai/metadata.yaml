readme: |
  自动欢迎新成员，AI 生成贴合人格的欢迎语；
  支持自定义唤醒词，回复可由 AI 微调，带回复概率避免刷屏。

  ## 主要功能
  - 自动欢迎新成员（连续入群自动合并成一条）
  - 自定义唤醒词 + 回复概率（0-100），AI 微调带说话人和原话上下文
  - 频率感知 + 触发上限：关键词刷屏自动闭嘴
  - 主动发言：机器人沉默太久时主动说话
  - 聊天模式：只响应唤醒词 / 任何消息都回复
  - 输出长度限制：AI 回复不会超长刷屏
  - 防风控：随机回复延迟、发送间隔、每分钟上限、AI 文案去重、夜间静默
  - 支持直连 API（失败自动重试）或复用 AstrBot provider

  ## 配置要点
  - **管理员白名单**：用 `欢迎` 命令前必填。
  - **API 地址 / 密钥 / 模型**：至少填好这三个 AI 才能用。
  - **唤醒词**：点“添加”，填关键词（必填）、回复文案、AI 要求、回复概率。
  - **夜间静默**：可填 `23:30-07:00` 之类的时段，夜里不打扰人。

  ## 命令
  - `欢迎 @某人` — 生成一句欢迎语（仅管理员）
  - `欢迎 昵称` — 手动指定昵称（仅管理员）

  ## 依赖
  - `aiohttp`